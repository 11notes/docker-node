name: "node"

x-lockdown: &lockdown
  # prevents write access to the image itself
  read_only: true
  # prevents any process within the container to gain more privileges
  security_opt:
    - "no-new-privileges=true"

services:
  app:
    image: "11notes/node:stable"
    <<: *lockdown
    environment:
      TZ: "Europe/Zurich"
    volumes:
      - "${PWD}/var:/node/var"
    tmpfs:
      # needed for read-only
      - "/node/run:uid=1000,gid=1000"
    networks:
      frontend:
    restart: "always"

networks:
  frontend: